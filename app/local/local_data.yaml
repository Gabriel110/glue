path: ./data/

data:
  - database: db_cards
    table: cards
    size: 1000
    columns:
      - name: id
        type: int
        seed: 123456
        random: false
      - name: name
        type: string
        prefix: card_
        seed: "00001"
        random: true
      - name: atk
        type: int
        seed: 987654
        random: true
        min: 1300
        max: 5000
      - name: level
        type: int
        seed: 123
        random: true
        min: 1
        max: 12
      - name: attribute
        type: string
        values: [DARK, LIGHT, EARTH, WATER, FIRE, WIND]
        random: true